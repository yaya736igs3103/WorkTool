<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redmine 管理報表</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (替換原有的 lucide-react 圖示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (用於在瀏覽器內編譯 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Helper Functions ---
        const getBaseUrl = (inputUrl) => {
            try {
                const urlObj = new URL(inputUrl);
                return urlObj.origin; 
            } catch (e) {
                return inputUrl.replace(/\/$/, '');
            }
        };

        const formatDate = (dateString, includeTime = false) => {
            if (!dateString) return '-';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return '-';
            const datePart = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
            if (!includeTime) return datePart;
            const timePart = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            return `${datePart} ${timePart}`;
        };

        // --- Storage Helpers ---
        const safeGetStorage = (key, defaultValue) => {
            try {
                const value = localStorage.getItem(key);
                return value !== null ? value : defaultValue;
            } catch (e) {
                return defaultValue;
            }
        };

        const safeSetStorage = (key, value) => {
            try {
                localStorage.setItem(key, value);
            } catch (e) {}
        };

        function App() {
            // --- Configuration State ---
            const [config, setConfig] = useState(() => ({
                url: safeGetStorage('redmine_url_manager', 'https://igs.redmine-x.com'),
                apiKey: safeGetStorage('redmine_apiKey_manager', ''),
                projectId: safeGetStorage('redmine_projectId_manager', '')
            }));

            const [specificIssueId, setSpecificIssueId] = useState('');

            // --- Time Selection State ---
            const [selectedMonth, setSelectedMonth] = useState(() => {
                const today = new Date();
                return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            });

            // --- Proxy Settings ---
            const [proxyMode, setProxyMode] = useState(() => safeGetStorage('redmine_proxyMode_manager', 'public'));
            const [customProxyUrl, setCustomProxyUrl] = useState(() => safeGetStorage('redmine_customProxyUrl_manager', 'http://YOUR_INTERNAL_PROXY/?url='));

            // --- App State ---
            const [issues, setIssues] = useState([]);
            const [closedStatusIds, setClosedStatusIds] = useState(['5', '3']); 
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(false);
            const [statusMessage, setStatusMessage] = useState(''); 
            const [error, setError] = useState(null);
            const [isDemo, setIsDemo] = useState(false);
            const [isDebugMode, setIsDebugMode] = useState(false);

            // --- Auto Save Effects ---
            useEffect(() => {
                safeSetStorage('redmine_url_manager', config.url);
                safeSetStorage('redmine_apiKey_manager', config.apiKey);
                safeSetStorage('redmine_projectId_manager', config.projectId);
            }, [config]);

            useEffect(() => safeSetStorage('redmine_proxyMode_manager', proxyMode), [proxyMode]);
            useEffect(() => safeSetStorage('redmine_customProxyUrl_manager', customProxyUrl), [customProxyUrl]);

            // --- Fetch Data Logic ---
            const fetchData = useCallback(async () => {
                const cleanApiKey = config.apiKey.trim();

                if (!cleanApiKey && !isDemo) {
                    setError('請輸入 API Token');
                    return;
                }

                setLoading(true);
                setError(null);
                setIssues([]);
                
                const [yearStr, monthStr] = selectedMonth.split('-');
                const selectedYear = parseInt(yearStr, 10);
                const selectedMonthIdx = parseInt(monthStr, 10) - 1; 

                // 提早 15 天涵蓋所有跨月緩衝
                const startObj = new Date(selectedYear, selectedMonthIdx, 1);
                startObj.setDate(startObj.getDate() - 15); 
                const startDateStr = `${startObj.getFullYear()}-${String(startObj.getMonth() + 1).padStart(2, '0')}-${String(startObj.getDate()).padStart(2, '0')}`;

                if (isDemo) {
                    setStatusMessage('產生模擬資料中...');
                    setTimeout(() => {
                        const demoUser = { id: 1, firstname: '主管', lastname: '王', login: 'wang' }; 
                        setCurrentUser(demoUser);
                        
                        const mockMonth = `${yearStr}-${monthStr}`;
                        const demoIssues = [
                            {
                                id: 101, subject: 'API 效能優化 (中途經待驗證再轉2)', author: { id: 90, name: '一般PM' }, assigned_to: { name: '原負責人(不計)' }, due_date: `${mockMonth}-10`, status: { id: 2, name: '實作中' }, updated_on: `${mockMonth}-15T10:00:00Z`,
                                custom_fields: [{ name: 'Processing', value: '工程師 A OLD_TS資源整合應用' }],
                                journals: [
                                    { created_on: `${mockMonth}-04T10:00:00Z`, details: [{ property: 'attr', name: 'status_id', old_value: '9', new_value: '12' }] },
                                    { created_on: `${mockMonth}-05T10:00:00Z`, details: [{ property: 'attr', name: 'status_id', old_value: '12', new_value: '2' }] }
                                ]
                            },
                            {
                                id: 226848, subject: '每日redmine工作 PA 自動化通知排程需求 (私人筆記測試)', author: { id: 1, name: '王主管' }, assigned_to: { name: '工程師 C' }, due_date: `${mockMonth}-10`, status: { id: 9, name: '待更新' }, updated_on: `${mockMonth}-26T10:00:00Z`,
                                custom_fields: [{ name: 'Processing', value: 'OLD_TS資源整合應用林威仲,OLD_TS資源整合應用邱廷維' }],
                                journals: [
                                    { created_on: `${mockMonth}-13T11:05:00Z`, user: { id: 1, name: '王主管' }, private_notes: true, notes: '<p>明明知道超連結沒反應<br/>還對外發送通知給窗口</p>' }
                                ]
                            },
                            {
                                id: 999998, subject: '新技術框架前測與討論 (因為關鍵字會被隱藏)', author: { id: 88, name: 'OLD_TS資源整合應用馮揚智' }, assigned_to: { id: 88, name: 'OLD_TS資源整合應用馮揚智' }, due_date: `${mockMonth}-20`, status: { id: 5, name: '已結束' }, updated_on: `${mockMonth}-26T10:00:00Z`,
                                custom_fields: [{ name: 'Processing', value: 'OLD_TS資源整合應用馮揚智' }],
                                journals: [
                                    { created_on: `${mockMonth}-25T11:05:00Z`, details: [{ property: 'attr', name: 'status_id', old_value: '2', new_value: '5' }] }
                                ]
                            },
                            {
                                id: 999999, subject: '個人工作備忘與程式重構 (有效個人案件)', author: { id: 88, name: 'OLD_TS資源整合應用馮揚智' }, assigned_to: { id: 88, name: 'OLD_TS資源整合應用馮揚智' }, due_date: `${mockMonth}-20`, status: { id: 5, name: '已結束' }, updated_on: `${mockMonth}-26T10:00:00Z`,
                                custom_fields: [{ name: 'Processing', value: 'OLD_TS資源整合應用馮揚智' }],
                                journals: [
                                    { created_on: `${mockMonth}-25T11:05:00Z`, details: [{ property: 'attr', name: 'status_id', old_value: '2', new_value: '5' }] }
                                ]
                            }
                        ];
                        setIssues(demoIssues);
                        setLoading(false);
                        setStatusMessage('');
                    }, 800);
                    return;
                }

                const performFetch = async (url, options = {}) => {
                    const res = await fetch(url, options);
                    if (!res.ok) {
                        if (res.status === 401 || res.status === 403) {
                            throw new Error('API Token 無效或無權限存取 (401/403)');
                        }
                        throw new Error(`請求失敗 (${res.status})`);
                    }
                    return await res.json();
                };

                const fetchWithProxy = async (endpoint, params = '') => {
                    const baseUrl = getBaseUrl(config.url);
                    const separator = endpoint.includes('?') ? '&' : '?';
                    const cacheBuster = `&_t=${Date.now()}`;
                    const targetUrl = `${baseUrl}${endpoint}${separator}key=${cleanApiKey}${params}${cacheBuster}`;

                    if (proxyMode === 'direct') {
                        try {
                            return await performFetch(targetUrl, { headers: { 'X-Redmine-API-Key': cleanApiKey } });
                        } catch (e) {
                            if (e.name === 'TypeError' || e.message.includes('Failed to fetch')) throw new Error('CORS_ERROR');
                            throw e;
                        }
                    }

                    if (proxyMode === 'custom') {
                        if (!customProxyUrl) throw new Error('請輸入自訂 Proxy 網址');
                        try {
                            const finalUrl = `${customProxyUrl}${encodeURIComponent(targetUrl)}`;
                            return await performFetch(finalUrl);
                        } catch (e) {
                            if (e.name === 'TypeError' || e.message.includes('Failed to fetch')) throw new Error('CUSTOM_PROXY_ERROR');
                            throw e;
                        }
                    }

                    const proxyProviders = [
                        { name: 'CodeTabs', fn: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}` },
                        { name: 'AllOrigins', fn: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
                        { name: 'CorsProxy.io', fn: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}` },
                    ];

                    let lastError = null;
                    for (const provider of proxyProviders) {
                        try {
                            const finalUrl = provider.fn(targetUrl);
                            const res = await fetch(finalUrl);
                            if (res.ok) return await res.json();
                            
                            if (res.status === 401 || res.status === 403) {
                                throw new Error('API Token 無效或無權限存取 (401/403)');
                            }
                            
                            lastError = new Error(`Proxy ${provider.name} error: ${res.status}`);
                        } catch (e) {
                            lastError = e;
                        }
                    }
                    throw lastError || new Error('無法連線到 Redmine，所有代理伺服器皆無回應。請檢查網址是否正確。');
                };

                const MAX_ATTEMPTS = 6;
                let finalError = null;

                for (let i = 0; i < MAX_ATTEMPTS; i++) {
                    try {
                        if (i > 0) {
                            setStatusMessage(`連線不穩，正在重試 (${i}/${MAX_ATTEMPTS - 1})...`);
                            await new Promise(r => setTimeout(r, 5000)); 
                        }

                        setStatusMessage('獲取使用者與系統狀態資訊...');
                        
                        const [userData, statusesData] = await Promise.all([
                            fetchWithProxy('/users/current.json').catch(() => ({ user: null })),
                            fetchWithProxy('/issue_statuses.json').catch(() => ({ issue_statuses: [] })) 
                        ]);
                        
                        if (userData && userData.user) {
                            setCurrentUser(userData.user);
                        }
                        
                        if (statusesData && statusesData.issue_statuses && statusesData.issue_statuses.length > 0) {
                            const closedIds = statusesData.issue_statuses.filter(s => s.is_closed).map(s => String(s.id));
                            if (closedIds.length > 0) setClosedStatusIds(closedIds);
                        }

                        let allFetchedBasicIssues = [];
                        const existingIds = new Set();

                        const addIssues = (issuesList) => {
                            issuesList.forEach(iss => {
                                if (!existingIds.has(iss.id)) {
                                    existingIds.add(iss.id);
                                    allFetchedBasicIssues.push(iss);
                                }
                            });
                        };
                        
                        const targetIssue = specificIssueId.trim();
                        const isSearchingSpecificIssue = targetIssue && /^\d+$/.test(targetIssue);

                        if (isSearchingSpecificIssue) {
                            setStatusMessage(`啟動獨立探測器：正在強制撈取單一案件 #${targetIssue} ...`);
                            try {
                                const specificIssueData = await fetchWithProxy(`/issues/${targetIssue}.json`, `&include=journals,custom_fields`);
                                if (specificIssueData && specificIssueData.issue) {
                                    setIssues([specificIssueData.issue]);
                                    setIsDebugMode(true); 
                                    setLoading(false);
                                    setStatusMessage('');
                                    return;
                                } else {
                                    throw new Error('找不到該案件');
                                }
                            } catch (e) {
                                throw new Error(`無法取得案件 #${targetIssue}。可能原因：無權限或被刪除。(${e.message})`);
                            }
                        } 
                        
                        const runBasicFetchLoop = async (projectId, extraParams, prefixMsg) => {
                            let localOffset = 0;
                            let fetchedList = [];
                            let useManualDateFallback = false; 

                            do {
                                if (localOffset > 0) await new Promise(r => setTimeout(r, 800));
                                setStatusMessage(`${prefixMsg} (尋找中 ${fetchedList.length} 筆)...`);
                                
                                let query = `&status_id=*&sort=updated_on:desc&limit=100&offset=${localOffset}`;
                                
                                if (projectId) {
                                    query += `&project_id=${encodeURIComponent(projectId)}`;
                                }
                                if (extraParams) {
                                    query += extraParams;
                                }
                                if (!useManualDateFallback) {
                                    query += `&updated_on=%3E%3D${startDateStr}`;
                                }

                                const data = await fetchWithProxy('/issues.json', query);
                                const items = data.issues || [];
                                
                                if (localOffset === 0 && items.length === 0 && !useManualDateFallback) {
                                    console.log("伺服器拒絕日期過濾，啟動手動翻頁降落傘...");
                                    useManualDateFallback = true;
                                    continue; 
                                }

                                if (items.length === 0) break;

                                if (useManualDateFallback) {
                                    let validItems = [];
                                    let hitOldData = false;
                                    for (let iss of items) {
                                        if (new Date(iss.updated_on) < startObj) {
                                            hitOldData = true;
                                            break;
                                        }
                                        validItems.push(iss);
                                    }
                                    fetchedList = fetchedList.concat(validItems);
                                    if (hitOldData) break;
                                } else {
                                    fetchedList = fetchedList.concat(items);
                                }

                                localOffset += 100;
                                if (localOffset >= 5000) break; 
                            } while (true);
                            return fetchedList;
                        };

                        const currentProj = config.projectId?.trim();
                        
                        if (currentProj) {
                            const list = await runBasicFetchLoop(currentProj, '', '【階段1】清查專案案件');
                            addIssues(list);
                        } else if (userData && userData.user) {
                            const listAuth = await runBasicFetchLoop(null, '&author_id=me', '【階段1】尋找您申請的案件');
                            addIssues(listAuth);
                            const listAssign = await runBasicFetchLoop(null, '&assigned_to_id=me', '【階段1】尋找分派給您的案件');
                            addIssues(listAssign);
                            const listUp = await runBasicFetchLoop(null, '&updated_by=me', '【階段1】尋找您最近留言過的案件');
                            addIssues(listUp);
                        } else {
                            throw new Error("若 Project ID 留空，必須使用有效的 API Token 進行全站掃描。");
                        }

                        if (allFetchedBasicIssues.length === 0) {
                            setIssues([]);
                            setLoading(false);
                            setStatusMessage('');
                            return;
                        }

                        let detailedIssues = [];
                        const totalIds = allFetchedBasicIssues.length;
                        let currentCount = 0;

                        const CONCURRENCY = proxyMode === 'public' ? 2 : 5;
                        const delayMs = proxyMode === 'public' ? 600 : 150;

                        for (let j = 0; j < totalIds; j += CONCURRENCY) {
                            const batch = allFetchedBasicIssues.slice(j, j + CONCURRENCY);
                            
                            const batchPromises = batch.map(async (basicIssue) => {
                                try {
                                    const res = await fetchWithProxy(`/issues/${basicIssue.id}.json`, `&include=journals,custom_fields`);
                                    return res.issue || basicIssue;
                                } catch(e) {
                                    return basicIssue; 
                                }
                            });
                            
                            const results = await Promise.all(batchPromises);
                            detailedIssues = detailedIssues.concat(results);
                            currentCount += batch.length;
                            
                            setStatusMessage(`【階段2】深度解析歷史與留言 ( ${currentCount} / ${totalIds} ) ...請稍候`);
                            await new Promise(r => setTimeout(r, delayMs)); 
                        }

                        setIssues(detailedIssues);
                        setLoading(false);
                        setStatusMessage('');
                        return;

                    } catch (err) {
                        finalError = err;
                        if (err.message.includes('401') || err.message.includes('403') || 
                            err.message === 'CORS_ERROR' || err.message === 'CUSTOM_PROXY_ERROR') {
                            break; 
                        }
                    }
                }

                setLoading(false);
                setStatusMessage('');
                
                let errMsg = finalError.message || '連線發生錯誤';
                if (finalError.message === 'CORS_ERROR') {
                    const isFileProtocol = window.location.protocol === 'file:';
                    errMsg = (
                        <span>
                            <b>直連失敗 (CORS 阻擋)</b><br/>
                            您選擇了「直連模式」，但瀏覽器擋下了請求。<br/>
                            <ul className="list-disc pl-5 mt-2 space-y-1 text-sm">
                                {isFileProtocol && (
                                    <li className="text-red-600 font-bold">
                                        [關鍵] 偵測到您使用檔案開啟 (file://)。<br/>
                                        請至擴充套件設定，開啟「允許存取檔案網址」。
                                    </li>
                                )}
                                <li>確認擴充套件 <b>Allow CORS: Access-Control-Allow-Origin</b> 已啟用。</li>
                                <li>
                                    <a href={config.url} target="_blank" rel="noreferrer" className="underline text-blue-600 hover:text-blue-800">
                                        點此開啟 Redmine
                                    </a>
                                    ，確認是否出現「憑證不安全」警告。若有，請先點擊「繼續前往」。
                                </li>
                            </ul>
                        </span>
                    );
                } else if (finalError.message === 'CUSTOM_PROXY_ERROR') {
                    errMsg = (<span><b>自訂 Proxy 連線失敗</b><br/>無法連線至：{customProxyUrl}</span>);
                } else if (typeof errMsg === 'string' && errMsg.includes('Failed to fetch')) {
                    errMsg = '無法建立連線。已嘗試自動重連但失敗。可能是網路問題或服務繁忙。';
                }
                setError(errMsg);
            }, [config, isDemo, proxyMode, customProxyUrl, selectedMonth, specificIssueId]);

            // --- Data Analysis Logic ---
            const analyzedData = useMemo(() => {
                const [yearStr, monthStr] = selectedMonth.split('-');
                const targetYear = parseInt(yearStr, 10);
                const targetMonthIdx = parseInt(monthStr, 10) - 1;

                const zone1 = []; 
                const zone2 = []; 
                const zone3 = {}; 
                const zone4 = []; 
                const zone5 = {}; 

                const userDict = {};
                issues.forEach(issue => {
                    if (issue.author) userDict[String(issue.author.id)] = issue.author.name;
                    if (issue.assigned_to) userDict[String(issue.assigned_to.id)] = issue.assigned_to.name;
                    if (issue.journals) {
                        issue.journals.forEach(j => {
                            if (j.user) userDict[String(j.user.id)] = j.user.name;
                        });
                    }
                });

                const isActuallyClosed = (statusObj) => {
                    if (!statusObj) return false;
                    if (closedStatusIds.includes(String(statusObj.id))) return true;
                    const name = statusObj.name.toLowerCase();
                    return name.includes('結') || name.includes('完成') || name.includes('closed') || name.includes('resolved');
                };

                const resolveProcessors = (issue) => {
                    let processors = [];
                    if (issue.custom_fields) {
                        const processingCf = issue.custom_fields.find(cf => cf.name === 'Processing' || cf.name.toLowerCase() === 'processing');
                        if (processingCf && processingCf.value) {
                            const valArray = Array.isArray(processingCf.value) 
                                ? processingCf.value 
                                : String(processingCf.value).split(/[,，]/).map(s => s.trim()).filter(Boolean);
                            
                            valArray.forEach(v => {
                                const idStr = String(v).trim();
                                if (!idStr) return;
                                const name = userDict[idStr] ? userDict[idStr] : idStr;
                                processors.push({ id: idStr, name: name });
                            });
                        }
                    }
                    if (processors.length === 0 && issue.assigned_to) {
                        processors.push({ id: String(issue.assigned_to.id), name: issue.assigned_to.name });
                    }
                    return processors.length > 0 ? processors : [{ id: '-', name: '-' }];
                };

                issues.forEach(issue => {
                    const processorsList = resolveProcessors(issue);

                    let isGlobalPersonalIssue = false;
                    if (issue.author) {
                        let isAllAuthor = processorsList.length > 0 && processorsList.every(p => {
                            if (p.name === '-') return true;
                            if (p.id !== '-' && p.id === String(issue.author.id)) return true;
                            if (issue.author.name && (p.name.includes(issue.author.name) || issue.author.name.includes(p.name))) return true;
                            return false;
                        });
                        
                        let isAssignedAuthor = issue.assigned_to && (String(issue.author.id) === String(issue.assigned_to.id) || issue.author.name === issue.assigned_to.name);

                        if (isAllAuthor || (processorsList.length === 1 && processorsList[0].name === '-' && isAssignedAuthor)) {
                            isGlobalPersonalIssue = true;
                        }
                    }

                    const hideFromGeneral = !isDebugMode && isGlobalPersonalIssue;

                    const journals = issue.journals || [];
                    const sortedJournals = [...journals].sort((a, b) => new Date(a.created_on) - new Date(b.created_on));

                    let first2to9Date = null;
                    let has9to2InTargetMonth = false;
                    let closedInTargetMonth = false;
                    const myPrivateNotes = [];
                    
                    let hasBeen9 = false;

                    sortedJournals.forEach(j => {
                        const jDate = new Date(j.created_on);
                        const isInTargetMonth = jDate.getFullYear() === targetYear && jDate.getMonth() === targetMonthIdx;

                        const statusChange = j.details?.find(d => d.property === 'attr' && d.name === 'status_id');
                        if (statusChange) {
                            const oldId = String(statusChange.old_value);
                            const newId = String(statusChange.new_value);

                            if (oldId === "9" || newId === "9") {
                                hasBeen9 = true;
                            }

                            if (newId === "2") {
                                if (isInTargetMonth && hasBeen9) {
                                    has9to2InTargetMonth = true;
                                }
                                hasBeen9 = false; 
                            }

                            if (isInTargetMonth && isDebugMode) {
                                has9to2InTargetMonth = true;
                            }

                            if (oldId === "2" && newId === "9" && !first2to9Date) {
                                first2to9Date = jDate;
                            }
                            if (closedStatusIds.includes(newId) && isInTargetMonth) {
                                closedInTargetMonth = true;
                            }
                        }

                        const isPrivate = j.private_notes === true || String(j.private_notes) === "true" || j.is_private === true || String(j.is_private) === "true";
                        
                        if (isInTargetMonth) {
                            if (isDebugMode) {
                                if (j.notes && j.notes.trim() !== "") {
                                    myPrivateNotes.push({ date: jDate, content: j.notes, isPrivate: isPrivate, author: j.user?.name });
                                }
                            } else if (isPrivate && j.notes && j.notes.trim() !== "") {
                                myPrivateNotes.push({ date: jDate, content: j.notes, isPrivate: isPrivate, author: j.user?.name });
                            }
                        }
                    });

                    if (!closedInTargetMonth && isActuallyClosed(issue.status)) {
                        const closeChange = [...sortedJournals].reverse().find(j => 
                            j.details?.some(d => d.property === 'attr' && d.name === 'status_id' && String(d.new_value) === String(issue.status.id))
                        );
                        
                        const cDate = closeChange ? new Date(closeChange.created_on) : (issue.closed_on ? new Date(issue.closed_on) : new Date(issue.updated_on));
                        
                        if (cDate.getFullYear() === targetYear && cDate.getMonth() === targetMonthIdx) {
                            closedInTargetMonth = true;
                        }
                    }

                    const rowData = {
                        ...issue,
                        actual_finish_date: first2to9Date,
                        actual_finish_date_str: first2to9Date ? formatDate(first2to9Date, true) : '-',
                        processor_name: processorsList.map(p => p.name).join(', '), 
                        processors_list: processorsList 
                    };

                    // --- Zone 1 邏輯寫入 ---
                    if (has9to2InTargetMonth && !hideFromGeneral) {
                        zone1.push(rowData);
                    }

                    // --- Zone 2 邏輯寫入 ---
                    let addedToZone2 = false;
                    if (first2to9Date && issue.due_date) {
                        const dueDateEnd = new Date(issue.due_date);
                        dueDateEnd.setHours(23, 59, 59, 999);
                        if (first2to9Date > dueDateEnd && 
                            first2to9Date.getFullYear() === targetYear && 
                            first2to9Date.getMonth() === targetMonthIdx) {
                            if (!hideFromGeneral) {
                                zone2.push(rowData);
                            }
                            addedToZone2 = true;
                        }
                    }
                    if (isDebugMode && !addedToZone2) {
                        const issueUpdated = new Date(issue.updated_on);
                        if (issueUpdated.getFullYear() === targetYear && issueUpdated.getMonth() === targetMonthIdx) {
                            zone2.push(rowData);
                        }
                    }

                    // --- Zone 3 & Zone 5 邏輯寫入 ---
                    if (closedInTargetMonth) {
                        rowData.processors_list.forEach(p => {
                            if (p.name === '-') return;

                            let isMe = false;
                            if (currentUser) {
                                if (p.id === String(currentUser.id)) {
                                    isMe = true;
                                } else {
                                    const fullName1 = `${currentUser.lastname || ''}${currentUser.firstname || ''}`.trim();
                                    const fullName2 = `${currentUser.firstname || ''}${currentUser.lastname || ''}`.trim();
                                    if (fullName1 && p.name.includes(fullName1)) isMe = true;
                                    if (fullName2 && p.name.includes(fullName2)) isMe = true;
                                    if (currentUser.login && p.name.includes(currentUser.login)) isMe = true;
                                }
                            }

                            let isAuthor = false;
                            if (issue.author) {
                                if (p.id !== '-' && p.id === String(issue.author.id)) {
                                    isAuthor = true;
                                } else if (issue.author.name && (p.name.includes(issue.author.name) || issue.author.name.includes(p.name))) {
                                    isAuthor = true;
                                }
                            }

                            if (!isMe) {
                                if (isAuthor) {
                                    if (isDebugMode || p.name.startsWith('OLD_TS資源整合應用')) {
                                        const hasExcludedKeyword = ['請假', '會議', '討論'].some(kw => issue.subject && issue.subject.includes(kw));
                                        if (isDebugMode || !hasExcludedKeyword) {
                                            if (!zone5[p.name]) zone5[p.name] = [];
                                            zone5[p.name].push(rowData);
                                        }
                                    }
                                } else {
                                    if (isDebugMode || p.name.includes('OLD_TS資源整合應用')) {
                                        if (!zone3[p.name]) zone3[p.name] = [];
                                        zone3[p.name].push(rowData); 
                                    }
                                }
                            }
                        });
                    }

                    // --- Zone 4 邏輯寫入 ---
                    myPrivateNotes.forEach(note => {
                        zone4.push({ issue: rowData, noteDate: note.date, content: note.content, isPrivate: note.isPrivate, author: note.author });
                    });
                });

                const sortedZone3 = Object.entries(zone3)
                    .sort((a, b) => b[1].length - a[1].length)
                    .map(([name, items]) => ({ name, count: items.length, items }));

                const sortedZone5 = Object.entries(zone5)
                    .sort((a, b) => b[1].length - a[1].length)
                    .map(([name, items]) => ({ name, count: items.length, items }));

                return { zone1, zone2, zone3: sortedZone3, zone4, zone5: sortedZone5 };
            }, [issues, selectedMonth, currentUser, closedStatusIds, isDebugMode]);

                        </a>

                        {issue.subject}

            const TableHeader = () => (

                                <div className="flex-1"></div>

                                <label className="flex items-center gap-1 cursor-pointer">

                                </label>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto p-5 mt-4">
                        {error && (
                            <div className="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-lg shadow-sm flex items-start animate-fadeIn">

                                <SectionCard 
                                    title={isDebugMode ? "驗證模式：所有個人案件統計 (不限關鍵字)" : "個人案件統計 (此月份內結案，不含請假/會議/討論)"}

                                                                </span>
                                                                {item.isPrivate ? (
                                                                    <span className="bg-red-100 text-red-600 px-1.5 py-0.5 rounded text-[10px] font-bold">私人</span>
                                                                ) : (
                                                                    <span className="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded text-[10px]">公開</span>
                                                                )}
                                                            </div>
                                                            <div className="text-slate-700 whitespace-pre-wrap bg-slate-50 p-2 rounded border border-slate-100" dangerouslySetInnerHTML={{__html: item.content}}></div>
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="4" className="p-8 text-center text-slate-400">
                                                        此月份無相關的私人筆記紀錄<br/>
                                                        <span className="text-xs mt-2 inline-block">💡 若您確定有筆記，請嘗試<b className="text-blue-500">將 Project ID 留空進行全站搜尋</b>。</span>
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </SectionCard>

                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
